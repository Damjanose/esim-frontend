<!doctype html>
<!--
  Source for public/og/esim2you-og.png (the link-preview image shown by
  WhatsApp, iMessage, Slack, X...). Edit this file, then run
  `pnpm og:render` and bump ogImageVersion in src/lib/seo.ts.
  app-icon.png is velocity-eSim/assets/icon.png (the mobile app icon).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700&family=Inter:wght@400;600&family=Geist:wght@600&display=block">
<style>
  :root {
    --surface: #f6f7fb;
    --brand-ink: #061131;
    --brand-blue: #0b49b7;
    --brand-mid: #0e86c0;
    --brand-teal: #09c3be;
    --on-surface-variant: #44495e;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--surface);
    color: var(--brand-ink);
    font-family: Inter, sans-serif;
  }

  .glow { position: absolute; border-radius: 50%; }
  .glow.teal { right: -160px; top: -220px; width: 840px; height: 840px; background: radial-gradient(circle, rgba(9, 195, 190, 0.22), transparent 65%); }
  .glow.blue { right: 280px; bottom: -380px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(11, 73, 183, 0.18), transparent 65%); }

  .copy {
    position: absolute; left: 80px; top: 64px; bottom: 60px; width: 620px; z-index: 3;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 18px; }
  .logo img { width: 60px; height: 60px; border-radius: 16px; box-shadow: 0 8px 24px rgba(11, 73, 183, 0.25); }
  .logo span { font-family: 'Hanken Grotesk'; font-weight: 700; font-size: 34px; letter-spacing: -0.4px; }
  .logo span i { font-style: normal; color: var(--brand-teal); }

  .label { font-family: Geist; font-weight: 600; font-size: 18px; letter-spacing: 3.2px; color: var(--brand-blue); }
  h1 { margin-top: 16px; font-family: 'Hanken Grotesk'; font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -3px; }
  h1 em {
    font-style: normal;
    background: linear-gradient(90deg, var(--brand-blue), var(--brand-mid) 55%, var(--brand-teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 20px; font-size: 25px; color: var(--on-surface-variant); }

  .stores { display: flex; gap: 12px; }
  .store {
    display: flex; align-items: center; gap: 10px; padding: 9px 20px 9px 16px;
    border-radius: 14px; background: var(--brand-ink); color: #fff; font-size: 14px; line-height: 1.1;
  }
  .store b { display: block; font-size: 21px; font-weight: 600; }
  .store svg { width: 26px; height: 26px; fill: #fff; }

  .icon {
    position: absolute; right: 124px; top: 88px; z-index: 2;
    width: 420px; height: 420px; border-radius: 96px;
    background: url(app-icon.png) center / cover;
    box-shadow: 0 80px 160px rgba(11, 73, 183, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.6);
    transform: rotate(-7deg);
  }

  .check {
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #4d78ff, var(--brand-blue) 60%, #072f86);
    box-shadow: 0 20px 48px rgba(11, 73, 183, 0.35);
  }
  .check svg { width: 55%; height: 55%; }
  .check.big { right: 500px; top: 72px; width: 92px; height: 92px; filter: blur(3px); }
  .check.small { right: 48px; top: 48px; width: 60px; height: 60px; filter: blur(5px); }

  .chip {
    position: absolute; right: 60px; bottom: 68px; z-index: 4;
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-radius: 28px; border: 2px solid rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(24px);
    box-shadow: 0 36px 80px rgba(6, 17, 49, 0.14);
    font-size: 20px; font-weight: 600;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--brand-teal); box-shadow: 0 0 16px var(--brand-teal); }
</style>
</head>
<body>
  <div class="glow teal"></div>
  <div class="glow blue"></div>

  <div class="copy">
    <div class="logo"><img src="app-icon.png" alt=""><span>eSim<i>2</i>you</span></div>
    <div>
      <div class="label">TRAVEL eSIM · 200+ DESTINATIONS</div>
      <h1>Easy setup,<br><em>instant connection.</em></h1>
      <p class="sub">No roaming fees. No physical SIM.</p>
    </div>
    <div class="stores">
      <div class="store">
        <svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.9-.8-3.1-.8C6.8 7.4 5.3 8.3 4.5 9.8c-1.7 2.9-.4 7.3 1.2 9.7.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.7-1-2.7-4.2zM14.1 5.6c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg>
        <span>Download on the<b>App Store</b></span>
      </div>
      <div class="store">
        <svg viewBox="0 0 24 24"><path d="M4 2.5v19l10.2-9.5zM15.3 13l2.4 2.3-11.4 6.4zM15.3 11 6.3 2.3l11.4 6.4zM18.7 9.3 21 10.6c.9.6.9 2.2 0 2.8l-2.3 1.3-2.6-2.7z"/></svg>
        <span>Get it on<b>Google Play</b></span>
      </div>
    </div>
  </div>

  <div class="icon"></div>
  <div class="check big"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div class="check small"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div class="chip"><span class="dot"></span>Connected · 5G</div>
</body>
</html>
